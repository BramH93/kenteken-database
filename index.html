<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenteken Database</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
/* (je bestaande CSS blijft exact hetzelfde — niet aangepast) */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Courier New', Courier, monospace; background:#f5f4f0; padding:30px;}
.upload-zone {border:2px dashed #aaa;padding:40px;text-align:center;margin-top:10px;cursor:pointer;}
.file-item {margin:5px 0;}
.btn {padding:8px 12px;margin-top:10px;cursor:pointer;}
</style>
</head>

<body>

<h2>🚗 Kenteken Database</h2>

<!-- ✅ NIEUW: BULK KLANT -->
<div style="margin-bottom:10px;">
  <input type="text" id="bulk-klant" placeholder="Naam klant voor deze upload">
</div>

<div class="upload-zone" onclick="fileInput.click()">
Klik om bestanden te kiezen
</div>

<input type="file" id="fileInput" multiple style="display:none">

<div id="queue"></div>

<button class="btn" onclick="processAll()">Verwerken</button>

<script>
let db = [];
let fileQueue = [];

const PATRONEN = [
 /\b([A-Z]{2}-?\d{2}-?\d{2})\b/g,
 /\b(\d{2}-?\d{2}-?[A-Z]{2})\b/g,
 /\b([A-Z]{2}-?\d{2}-?[A-Z]{2})\b/g,
];

function detectKentekens(text) {
  let res = new Set();
  text = String(text).toUpperCase();
  
  PATRONEN.forEach(p => {
    let m;
    while ((m = p.exec(text)) !== null) {
      res.add(m[1].replace(/-/g, '-'));
    }
  });

  return [...res];
}

fileInput.addEventListener('change', e => {
  const bulkKlant = document.getElementById('bulk-klant').value.trim();

  Array.from(e.target.files).forEach(f => {
    fileQueue.push({
      file: f,
      klant: bulkKlant || 'Onbekend',
      status: 'pending'
    });
  });

  renderQueue();
});

function renderQueue() {
  const q = document.getElementById('queue');
  q.innerHTML = fileQueue.map(f => `
    <div class="file-item">
      ${f.file.name} → <b>${f.klant}</b>
    </div>
  `).join('');
}

function processAll() {
  const bulkKlant = document.getElementById('bulk-klant').value.trim();

  if (!bulkKlant) {
    alert("Vul eerst een klant in!");
    return;
  }

  let i = 0;
  function next() {
    if (i >= fileQueue.length) {
      alert("Klaar!");
      console.log(db);
      return;
    }

    processOne(fileQueue[i], () => {
      i++;
      next();
    });
  }

  next();
}

function processOne(qf, cb) {
  const reader = new FileReader();

  reader.onload = e => {
    const wb = XLSX.read(e.target.result, { type: 'array' });

    wb.SheetNames.forEach(s => {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[s], {header:1});

      rows.forEach(r => {
        r.forEach(c => {
          detectKentekens(c).forEach(k => {
            db.push({
              kenteken: k,
              klant: qf.klant,
              bron: qf.file.name
            });
          });
        });
      });
    });

    cb();
  };

  reader.readAsArrayBuffer(qf.file);
}
</script>

</body>
</html>
